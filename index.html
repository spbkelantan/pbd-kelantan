<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal Pentaksiran Bilik Darjah Negeri Kelantan | Gerbang Keselamatan</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary-navy: #0b1a30;
      --secondary-blue: #0f2b48;
      --accent-cyan: #00d2ff;
      --accent-gold: #ffbe3b;
      --accent-emerald: #10b981;
      --accent-red: #ef4444;
      --glass-bg: rgba(15, 33, 60, 0.82);
      --glass-border: rgba(255, 255, 255, 0.12);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at 50% 10%, #17335c 0%, #08111e 100%);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow-x: hidden;
      padding: 24px 16px;
    }

    .ambient-glow {
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 210, 255, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
      top: -100px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 0;
      pointer-events: none;
      filter: blur(40px);
    }

    .ambient-glow-bottom {
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 190, 59, 0.08) 0%, rgba(0, 0, 0, 0) 70%);
      bottom: -150px;
      right: 10%;
      z-index: 0;
      pointer-events: none;
      filter: blur(50px);
    }

    .gateway-wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 540px;
    }

    .card {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 36px 32px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), 
                  0 0 0 1px rgba(255, 255, 255, 0.05);
    }

    .logos-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 24px;
    }

    /* Latar belakang putih khusus untuk logo */
    .logo-container {
      background: #ffffff;
      border: 2px solid rgba(255, 255, 255, 0.9);
      border-radius: 16px;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
    }

    .logo-container img {
      max-height: 60px;
      max-width: 125px;
      object-fit: contain;
      display: block;
    }

    .logo-divider {
      width: 1px;
      height: 50px;
      background: linear-gradient(to bottom, transparent, rgba(255, 255, 255, 0.35), transparent);
    }

    .header-text {
      text-align: center;
      margin-bottom: 28px;
    }

    .title-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 210, 255, 0.1);
      border: 1px solid rgba(0, 210, 255, 0.25);
      color: var(--accent-cyan);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 50px;
      margin-bottom: 12px;
    }

    .portal-title {
      font-size: 19px;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.35;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .portal-subtitle {
      font-size: 13.5px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #64748b;
      font-size: 17px;
    }

    .form-input {
      width: 100%;
      background: rgba(11, 23, 42, 0.65);
      border: 1.5px solid rgba(255, 255, 255, 0.14);
      border-radius: 14px;
      padding: 13px 16px 13px 44px;
      color: #ffffff;
      font-size: 14.5px;
      transition: all 0.25s ease;
      outline: none;
    }

    .form-input:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 0 3px rgba(0, 210, 255, 0.18);
      background: rgba(11, 23, 42, 0.85);
    }

    .form-input.error {
      border-color: var(--accent-red);
      box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.18);
    }

    .error-msg {
      display: none;
      color: #fca5a5;
      font-size: 12.5px;
      margin-top: 8px;
      line-height: 1.4;
    }

    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, #0077b6 0%, #00b4d8 100%);
      color: #ffffff;
      border: none;
      border-radius: 14px;
      padding: 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 8px 20px -4px rgba(0, 180, 216, 0.4);
      transition: all 0.25s ease;
    }

    .btn-submit:hover {
      background: linear-gradient(135deg, #0089d4 0%, #00c7ee 100%);
      transform: translateY(-2px);
      box-shadow: 0 12px 24px -4px rgba(0, 180, 216, 0.55);
    }

    .status-panel {
      display: none;
      margin-top: 24px;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 14px;
      padding: 18px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      text-align: left;
    }

    .step-item {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      color: #64748b;
      margin-bottom: 10px;
    }

    .step-item:last-child {
      margin-bottom: 0;
    }

    .step-icon {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid #475569;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      flex-shrink: 0;
    }

    .step-item.active {
      color: #38bdf8;
    }

    .step-item.active .step-icon {
      border-color: #38bdf8;
      border-top-color: transparent;
      animation: spin 0.8s linear infinite;
    }

    .step-item.done {
      color: #4ade80;
    }

    .step-item.done .step-icon {
      border-color: #4ade80;
      background: #4ade80;
      color: #0b1a30;
      font-weight: bold;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    .success-view {
      display: none;
      text-align: center;
    }

    .badge-success {
      width: 68px;
      height: 68px;
      background: rgba(16, 185, 129, 0.15);
      border: 2px solid rgba(16, 185, 129, 0.4);
      color: var(--accent-emerald);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin: 0 auto 18px;
      box-shadow: 0 0 25px rgba(16, 185, 129, 0.25);
    }

      background: rgba(
